<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Employee Regisration</h1>
    <fieldset>
        
        <legend>Personal Information</legend>
        <table>
        <tr>
            <td>Employee id :</td>
             <td><input type="text"></td>
        </tr>
        <tr>
            <td>Employee Name :</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Email :</td>
            <td><input type="email"></td>
        </tr>
        <tr>
            <td>Contact Number :</td>
            <td><input type="number"></td>
        </tr>
        <tr>
            <td>Marital Status :</td>
             <td>Married<input type="radio"></td>
             <td>Single<input type="radio"></td>
        </tr>
        </table>

    </fieldset>
    
        <legend>Education/Experience<legend>
        <table>
            <tr>
                <td>Education :</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Experience :</td>
                <td><input type="text"></td>
            </tr>
        </table>
    
</body>
</html>
