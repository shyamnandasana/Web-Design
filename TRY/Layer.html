<!DOCTYPE html>
<html>
<head>
    <title>Styled List Example</title>
    <style>
        .box {
  display: inline-block;
  width: 100px;
  height: 100px;
  background: red;
  color: white;
}

#two {
  position:fixed    ;
  top: 20px;
  left: 20px;
  background: blue;
}
    
    </style>
</head>
<body>
    <div class="box" id="one">One</div>
    <div class="box" id="two">Two</div>
    <div class="box" id="three">Three</div>
    <div class="box" id="four">Four</div>    
</body>
</html>
