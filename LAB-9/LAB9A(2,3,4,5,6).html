
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
          .box1{
             animation-duration: 5s;
             animation-name: anim1;
             font-size: 300%;
             height: 100%;
             width:25%;
             animation-delay: 2s;
             animation-iteration-count: infinite;
             background-color: blanchedalmond;
             animation-direction: reverse;
             animation-timing-function: ease;
             }
         @keyframes anim1 {
           0% {
            margin:0;
           }
           25%{
            margin-left: 500px;
            margin-top: 0;
           }
           50%{
            margin-left :500px; 
            margin-top: 500px;
           }
           75%{
            margin-left:0px;
            margin-top:500px;
           }
           100%{
            margin-left: 0px;
            margin-top: 0px;
           }
         }
                    
          
     </style>
</head>
<body>
    <div class="box1">HELLO WORLD</div>
    
</body>
</html>
