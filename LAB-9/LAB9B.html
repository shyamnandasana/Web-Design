<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         div{
            animation-duration: 25s;
            animation-name: circle;
            height: 100px;
            width:100px;
            float: left;
            }
         .div1{
            animation-delay:1s;
         }
         .div2{
            animation-delay: 2s;
         }
         .div3{  
            animation-delay:3s;
         }
         .div4{
            animation-delay:4s;
         }
         .div5{
            animation-delay:5s;
         }
         .div6{
            
            animation-delay:6s;
         }
         .div7{
            animation-delay:7s;
         }
         .div8{
            
            animation-delay:8s;
         }
         .div9{
            animation-delay:9s;
         }
        @keyframes circle{
         from{
            background-color: aquamarine;
            margin-top: 0%;
            border-radius: 0%; 
          }
          to{ 
            background-color: blue; 
            margin-top:50%;
            border-radius:50%;
        }
    }
    </style>
</head>
<body>
    <div class="div1"></div>
    <div class="div2"></div>
    <div class="div3"></div>
    <div class="div4"></div>
    <div class="div5"></div>
    <div class="div6"></div>
    <div class="div7"></div>
    <div class="div8"></div>
    <div class="div9"></div>
</body>
</html>
