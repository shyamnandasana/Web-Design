<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
          .box{
             animation-duration: 5s;
             animation-name: anim1;
             font-size: 300%;
             width:30%;
            
         }
         @keyframes anim1 {
           to {
            background-color: yellow;
           }
           from{
            background-color: red;
           }
         }
                    
          
     </style>
</head>
<body>
    <div class="box">HELLO WORLD</div>
    
</body>
</html>
