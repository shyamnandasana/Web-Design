<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <fieldset class="border border-2f" style="width:850px">
      <form class="text-center" style="width:800px">
    <span class="border border-black">
    <h1 class="text-center">COVID-19 Vaccine Registration Form</h1>
    <div class="row g-3 mb-4  align-items-center">
      <div class="col">
        <label for="text" class="col-form-label sm-2 text-center">First Name</label>
      </div>
      <div class="col">
          <input type="text" id="inputPassword6" class="form-control" aria-describedby="passwordHelpInline">
      </div>
    </div>
    
    <div class="row g-3 mb-4 align-items-center">
      <div class="col">
        <label for="inputPassword6" class="col-form-label">Second Name</label>
      </div>
      <div class="col">
        <input type="text" id="inputPassword6" class="form-control" aria-describedby="passwordHelpInline">
      </div>
    </div>
    <div class="row g-3 mb-4 align-items-center">
      <div class="col">
        <label for="text" class="col-form-label">Adhar Number</label>
      </div>
      <div class="col">
        <input type="password" id="inputPassword6" class="form-control" aria-describedby="passwordHelpInline">
      </div>
    </div>
    <div class="row g-3 mb-4  align-items-center">
      <div class="col">
        <label for="inputPassword6" class="col-form-label">Vaccine Name</label>
      </div>
      <div class="col">
        <select class="form-select" aria-label="Default select example">
          <option selected>Please Select Vaccine Name</option>
          <option value="1">One</option>
          <option value="2">Two</option>
          <option value="3">Three</option>
        </select>
      </div>
    </div>
    <div class="row g-3 mb-4 align-items-center">
      <div class="col">
        <label for="inputPassword6" class="col-form-label">Vaccination Center Name</label>
      </div>
      <div class="col">
        <select class="form-select" aria-label="Default select example">
          <option selected>Please Select Vaccination Center Name</option>
          <option value="1">One</option>
          <option value="2">Two</option>
          <option value="3">Three</option>
        </select>
      </div>
    </div>
    <div class="row g-3 mb-4 align-items-center">
      <div class="col">
        <label for="inputPassword6" class="col-form-label">Date of Does</label>
      </div>
      <div class="col">
        <input type="Date" id="inputPassword6" class="form-control" aria-describedby="passwordHelpInline">
      </div>
    </div>
    <div class="row g-3 mb-4 align-items-center">
      <div class="col">
        <label for="inputPassword6" class="col-form-label">Does Number</label>
      </div>
      <div class="col">
        <input type="password" id="inputPassword6" class="form-control" aria-describedby="passwordHelpInline">
      </div>
    </div>
    <div class="col-12 text-center">
      <button class="btn btn-secondary"> CLICK HERE</button>
      <button class="btn btn-secondary"> CANCLE</button>
    </div>
    
    </span>
  </form>
  </fieldset>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
