<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <form align="center" class="g-5 bg-body-secondary col-5">
        <div class="container align-center col-6">
          <div class="display-3">
            <i class="bi bi-bootstrap-fill displey-1"></i>
          </div>
            <h2 class="text-center"> Please Sign in</h2>
            <div class="form-floating">
                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                <label for="floatingInput">Email address</label>
              </div>
              <div class="form-floating">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Password</label>
              </div>
              <div class="col-7 ">
              <div class="m-3">
                <div class="form-check text-center">
                  <input class="form-check-input-center " type="checkbox" value="" id="invalidCheck" required>
                  <label class="form-check-label-center" for="invalidCheck">Reminder Me</label>
                  </div>
                  </div>
                  </div>
                  <button type="button" class="mb-4 col-7 btn btn-primary btn-lg">Sign In</button>

                  <div class="text-center">
                     c-2017-2018

                  </div>
               
        </div>





</form>
</body>
</html>
